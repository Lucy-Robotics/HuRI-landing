name: links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      # No network: links into Lucy-Robotics are checked against the known
      # repositories, relative links against this checkout.
      - run: python check_links.py
      - run: pytest -q

  deep-links:
    # The pages link into huri-core, huri-modules and huri-cli at `main`
    # (packages, deploy/, registry.toml, RELEASING.md, huri-meta/, #anchors):
    # check each such path against a shallow checkout of their `main`.
    # Non-blocking until these repositories exist under their names and
    # `main` holds the split layout (the split cutover; see CONTRIBUTING.md).
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          path: HuRI-landing
      - uses: actions/checkout@v4
        with:
          repository: Lucy-Robotics/huri-core
          ref: main
          path: huri-core
      - uses: actions/checkout@v4
        with:
          repository: Lucy-Robotics/huri-modules
          ref: main
          path: huri-modules
      - uses: actions/checkout@v4
        with:
          repository: Lucy-Robotics/huri-cli
          ref: main
          path: huri-cli
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python HuRI-landing/check_links.py --siblings .
